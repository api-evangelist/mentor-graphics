name: Mentor Graphics
description: Mentor Graphics was a leading electronic design automation (EDA) software vendor whose tools
  span integrated-circuit design and verification, PCB and electronic-systems design, and manufacturing
  analysis. Battery Ventures held a position in the company. In 2017 Mentor Graphics was acquired by Siemens
  and its portfolio now ships as Siemens EDA (part of Siemens Digital Industries Software), including
  Calibre for physical verification and DFM, the Questa functional verification platform, and the Xpedition
  / PADS PCB design suites. The mentor.com domain now redirects to the Siemens EDA site. Siemens EDA delivers
  desktop and cloud-hosted engineering software and managed services; it does not publish a public developer
  REST API, OpenAPI definition, or self-serve developer portal, so there is no public API surface to enrich
  for this provider.
